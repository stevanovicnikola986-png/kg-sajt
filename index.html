<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Outreach CRM</title>
<style>
  :root {
    --bg: #f5f6f8;
    --surface: #ffffff;
    --surface-2: #f0f2f5;
    --border: #e2e5ea;
    --text: #1a1d23;
    --text-soft: #61656d;
    --text-faint: #9aa0a8;
    --accent: #3b6ef5;
    --accent-soft: #e7eefe;
    --shadow: 0 1px 3px rgba(16,24,40,.06), 0 1px 2px rgba(16,24,40,.04);
    --radius: 12px;
    --danger: #dc2626;
    --funnel: #3b6ef5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #14161a; --surface: #1c1f26; --surface-2: #23272f;
      --border: #2d323b; --text: #eceef1; --text-soft: #a3a9b3; --text-faint: #6b727d;
      --accent: #5b83f7; --accent-soft: #1e2a4a; --shadow: 0 1px 3px rgba(0,0,0,.4);
      --funnel: #5b83f7;
    }
  }
  :root[data-theme="dark"] {
    --bg: #14161a; --surface: #1c1f26; --surface-2: #23272f;
    --border: #2d323b; --text: #eceef1; --text-soft: #a3a9b3; --text-faint: #6b727d;
    --accent: #5b83f7; --accent-soft: #1e2a4a; --shadow: 0 1px 3px rgba(0,0,0,.4);
    --funnel: #5b83f7;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased;
  }

  header.topbar {
    position: sticky; top: 0; z-index: 30;
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 14px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; }
  .brand .logo { width: 30px; height: 30px; border-radius: 8px; background: var(--accent);
    display: grid; place-items: center; color: #fff; font-size: 16px; }
  .topbar .spacer { flex: 1; }

  .btn { appearance: none; border: 1px solid var(--border); background: var(--surface);
    color: var(--text); padding: 8px 14px; border-radius: 9px; font-size: 13px; cursor: pointer;
    font-weight: 600; display: inline-flex; align-items: center; gap: 6px; transition: background .12s, border-color .12s; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.05); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--surface-2); }
  .btn.danger { color: var(--danger); }
  .btn.sm { padding: 5px 10px; font-size: 12px; }

  main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 80px; }

  .section-title { font-size: 13px; font-weight: 700; color: var(--text-soft); text-transform: uppercase;
    letter-spacing: .4px; margin: 0 0 10px 2px; }

  /* Funnel dashboard */
  .funnel-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
  .funnel { display: flex; flex-direction: column; gap: 7px; }
  .f-row { position: relative; border-radius: 9px; overflow: hidden; background: var(--surface-2);
    height: 44px; display: flex; align-items: center; }
  .f-bar { position: absolute; left: 0; top: 0; bottom: 0; width: var(--pct, 0%);
    background: var(--funnel); opacity: .16; transition: width .4s ease; }
  .f-row:nth-child(1) .f-bar { opacity: .28; }
  .f-content { position: relative; z-index: 1; display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 0 14px; }
  .f-ico { width: 22px; text-align: center; font-size: 16px; }
  .f-label { font-weight: 600; font-size: 14px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .f-conv { font-size: 11px; font-weight: 700; color: var(--text-faint); background: var(--surface);
    border: 1px solid var(--border); padding: 2px 7px; border-radius: 20px; white-space: nowrap; }
  .f-num { font-size: 20px; font-weight: 800; min-width: 34px; text-align: right; }

  .mini-stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
  .mini { background: var(--surface); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px 14px; box-shadow: var(--shadow); }
  .mini .n { font-size: 18px; font-weight: 700; }
  .mini .l { font-size: 11px; color: var(--text-soft); }
  .mini.alert .n { color: var(--danger); }

  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 16px; }
  .toolbar input[type="search"], .toolbar select { padding: 8px 12px; border: 1px solid var(--border);
    border-radius: 9px; background: var(--surface); color: var(--text); font-size: 13px; }
  .toolbar input[type="search"] { min-width: 200px; flex: 1; max-width: 320px; }

  .contacts { display: flex; flex-direction: column; gap: 10px; }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    box-shadow: var(--shadow); overflow: hidden; }
  .contact-head { display: flex; align-items: flex-start; gap: 14px; padding: 14px 16px; cursor: pointer; }
  .avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; display: grid; place-items: center;
    font-weight: 700; color: #fff; font-size: 15px; }
  .contact-main { flex: 1; min-width: 0; }
  .contact-name { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .contact-sub { color: var(--text-soft); font-size: 13px; margin-top: 2px; }
  .contact-sub a { color: var(--text-soft); text-decoration: none; }
  .contact-sub a:hover { color: var(--accent); text-decoration: underline; }
  .contact-meta { text-align: right; flex-shrink: 0; font-size: 12px; color: var(--text-faint); }

  .badge { font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 20px; white-space: nowrap;
    color: #fff; }
  .badge.stage0 { background: #9aa0a8; }
  .badge.dead { background: var(--danger); }

  .followup-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 600; margin-top: 4px; }
  .followup-pill.due { color: var(--danger); }
  .followup-pill.today { color: #d97706; }
  .followup-pill.upcoming { color: var(--text-soft); }

  .contact-body { border-top: 1px solid var(--border); display: none; }
  .card.open .contact-body { display: block; }
  .contact-body-inner { padding: 14px 16px; }

  /* Stage chips (funnel progress control) */
  .stage-track { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
  .stage-chip { border: 1px solid var(--border); background: var(--surface); color: var(--text-soft);
    padding: 5px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; transition: all .12s; }
  .stage-chip:hover { border-color: var(--funnel); }
  .stage-chip.reached { background: var(--funnel); border-color: var(--funnel); color: #fff; }
  .stage-chip .num { opacity: .7; font-weight: 800; }

  .quick-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }

  .activity-list { display: flex; flex-direction: column; gap: 0; }
  .activity { display: flex; gap: 12px; padding: 10px 0; border-top: 1px dashed var(--border); }
  .activity:first-child { border-top: none; }
  .act-icon { width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0; display: grid; place-items: center;
    font-size: 15px; background: var(--surface-2); }
  .act-body { flex: 1; min-width: 0; }
  .act-top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; }
  .act-type { font-weight: 600; font-size: 13px; }
  .act-date { color: var(--text-faint); font-size: 12px; white-space: nowrap; }
  .act-outcome { font-size: 12px; color: var(--text-soft); }
  .act-note { font-size: 13px; margin-top: 3px; white-space: pre-wrap; word-break: break-word; }
  .act-del { color: var(--text-faint); background: none; border: none; cursor: pointer; font-size: 13px; padding: 2px 6px; border-radius: 6px; }
  .act-del:hover { color: var(--danger); background: var(--surface-2); }

  .empty { text-align: center; color: var(--text-faint); padding: 60px 20px; }
  .empty .big { font-size: 40px; margin-bottom: 10px; }

  .overlay { position: fixed; inset: 0; background: rgba(16,24,40,.5); z-index: 50; display: none;
    align-items: flex-start; justify-content: center; padding: 40px 16px; overflow-y: auto; }
  .overlay.show { display: flex; }
  .modal { background: var(--surface); border-radius: 16px; width: 100%; max-width: 520px;
    box-shadow: 0 20px 50px rgba(0,0,0,.3); border: 1px solid var(--border); }
  .modal-head { padding: 18px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .modal-head h3 { margin: 0; font-size: 17px; }
  .modal-body { padding: 20px; }
  .modal-foot { padding: 16px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }

  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--text-soft); margin-bottom: 5px; }
  .field input, .field select, .field textarea { width: 100%; padding: 9px 12px; border: 1px solid var(--border);
    border-radius: 9px; background: var(--bg); color: var(--text); font-size: 14px; font-family: inherit; }
  .field textarea { resize: vertical; min-height: 70px; }
  .field.check { display: flex; align-items: center; gap: 8px; }
  .field.check input { width: auto; }
  .field.check label { margin: 0; }
  .field-row { display: flex; gap: 12px; }
  .field-row .field { flex: 1; }
  .close-x { background: none; border: none; font-size: 22px; cursor: pointer; color: var(--text-faint); line-height: 1; }
  .close-x:hover { color: var(--text); }
  .hint { font-size: 12px; color: var(--text-faint); margin-top: 6px; }

  @media (max-width: 560px) {
    .contact-meta { display: none; }
    .field-row { flex-direction: column; gap: 0; }
    .brand span.name { display: none; }
    .f-conv { display: none; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><div class="logo">📇</div><span class="name">Outreach CRM</span></div>
  <div class="spacer"></div>
  <button class="btn ghost sm" id="themeBtn" title="Tema">🌓</button>
  <button class="btn ghost sm" id="exportBtn" title="Izvezi podatke">⬇ Backup</button>
  <button class="btn ghost sm" id="importBtn" title="Uvezi podatke">⬆ Uvoz</button>
  <button class="btn ghost sm" id="csvBtn" title="CSV izveštaj">📄 CSV</button>
  <button class="btn primary" id="addContactBtn">+ Novi kontakt</button>
</header>

<main>
  <div class="section-title">Levak (funnel)</div>
  <div class="funnel-wrap"><div class="funnel" id="funnel"></div></div>
  <div class="mini-stats" id="miniStats"></div>

  <div class="toolbar">
    <input type="search" id="search" placeholder="🔍 Pretraži ime, firmu, telefon…" />
    <select id="filterStage">
      <option value="">Svi kontakti</option>
      <option value="s1">Dostigli: Poslata poruka</option>
      <option value="s2">Dostigli: Odgovorio</option>
      <option value="s3">Dostigli: Prihvatio da vidi sajt</option>
      <option value="s4">Dostigli: Pozitivan utisak</option>
      <option value="s5">Dostigli: Zakazan poziv</option>
      <option value="s6">Dostigli: Održan poziv</option>
      <option value="s7">Dostigli: Prodaja</option>
      <option value="dead">Odbijeni / nezainteresovani</option>
    </select>
    <select id="sortBy">
      <option value="stage">Sortiraj: Faza (najdalji prvi)</option>
      <option value="followup">Sortiraj: Follow-up</option>
      <option value="recent">Sortiraj: Poslednja aktivnost</option>
      <option value="name">Sortiraj: Ime (A-Š)</option>
      <option value="created">Sortiraj: Novi kontakti</option>
    </select>
    <label class="btn ghost sm" style="cursor:pointer;"><input type="checkbox" id="onlyDue" style="margin-right:6px;">Samo dospeli</label>
  </div>

  <div class="contacts" id="contacts"></div>
</main>

<!-- Contact modal -->
<div class="overlay" id="contactOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="contactModalTitle">Novi kontakt</h3>
      <button class="close-x" data-close>×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="c_id" />
      <div class="field-row">
        <div class="field"><label>Ime i prezime *</label><input id="c_name" placeholder="Petar Petrović" /></div>
        <div class="field"><label>Firma</label><input id="c_company" placeholder="Firma d.o.o." /></div>
      </div>
      <div class="field-row">
        <div class="field"><label>Telefon</label><input id="c_phone" placeholder="+381 6x xxx xxxx" /></div>
        <div class="field"><label>Email</label><input id="c_email" placeholder="email@primer.rs" /></div>
      </div>
      <div class="field">
        <label>Faza u levku (dokle se stiglo)</label>
        <select id="c_stage">
          <option value="0">— još ništa —</option>
          <option value="1">1 · Poslata poruka</option>
          <option value="2">2 · Odgovorio</option>
          <option value="3">3 · Prihvatio da vidi sajt</option>
          <option value="4">4 · Pozitivan utisak</option>
          <option value="5">5 · Zakazan poziv</option>
          <option value="6">6 · Održan poziv</option>
          <option value="7">7 · Prodaja</option>
        </select>
        <div class="hint">Levak je redosledan: izbor faze podrazumeva da su prethodne već prošle.</div>
      </div>
      <div class="field"><label>Izvor</label><input id="c_source" placeholder="Instagram, preporuka…" /></div>
      <div class="field"><label>Sledeći follow-up</label><input type="date" id="c_followup" /></div>
      <div class="field check"><input type="checkbox" id="c_dead" /><label for="c_dead">Odbijen / nezainteresovan</label></div>
      <div class="field"><label>Napomena</label><textarea id="c_notes" placeholder="Kratka beleška o kontaktu…"></textarea></div>
    </div>
    <div class="modal-foot">
      <button class="btn danger" id="deleteContactBtn" style="margin-right:auto; display:none;">Obriši</button>
      <button class="btn" data-close>Otkaži</button>
      <button class="btn primary" id="saveContactBtn">Sačuvaj</button>
    </div>
  </div>
</div>

<!-- Activity modal -->
<div class="overlay" id="activityOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="activityModalTitle">Nova aktivnost</h3>
      <button class="close-x" data-close-act>×</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="a_contactId" />
      <div class="field-row">
        <div class="field"><label>Tip</label>
          <select id="a_type">
            <option value="poziv">📞 Poziv</option>
            <option value="poruka">💬 Poruka</option>
            <option value="email">✉️ Email</option>
            <option value="sastanak">🤝 Sastanak</option>
            <option value="beleska">📝 Beleška</option>
          </select>
        </div>
        <div class="field"><label>Datum</label><input type="datetime-local" id="a_date" /></div>
      </div>
      <div class="field"><label>Ishod</label>
        <select id="a_outcome">
          <option value="">— bez ishoda —</option>
          <option value="Javio se">Javio se</option>
          <option value="Nije se javio">Nije se javio</option>
          <option value="Poslato">Poslato</option>
          <option value="Odgovorio">Odgovorio</option>
          <option value="Zainteresovan">Zainteresovan</option>
          <option value="Zakazano">Zakazano</option>
          <option value="Održan poziv">Održan poziv</option>
          <option value="Prodaja">Prodaja</option>
          <option value="Odbio">Odbio</option>
          <option value="Pozvati kasnije">Pozvati kasnije</option>
        </select>
      </div>
      <div class="field"><label>Beleška</label><textarea id="a_note" placeholder="Šta je dogovoreno / rečeno…"></textarea></div>
      <div class="field"><label>Zakaži sledeći follow-up (opciono)</label><input type="date" id="a_nextFollowup" />
        <div class="hint">Ako uneseš datum, ažuriraće se follow-up ovog kontakta.</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn" data-close-act>Otkaži</button>
      <button class="btn primary" id="saveActivityBtn">Sačuvaj aktivnost</button>
    </div>
  </div>
</div>

<input type="file" id="importFile" accept="application/json" style="display:none;" />

<script>
(function () {
  "use strict";

  const KEY = "outreach_crm_v1";
  const THEME_KEY = "outreach_crm_theme";

  // Redosledan levak (funnel). key = faza (1..7).
  const STAGES = [
    { key: 1, icon: "✉️", short: "Poruka",   plural: "Poslate poruke" },
    { key: 2, icon: "↩️", short: "Odgovor",  plural: "Odgovori" },
    { key: 3, icon: "🌐", short: "Vidi sajt", plural: "Prihvatili da vide sajt" },
    { key: 4, icon: "👍", short: "Utisak",   plural: "Pozitivni utisci" },
    { key: 5, icon: "📅", short: "Zakazan",  plural: "Zakazani pozivi" },
    { key: 6, icon: "📞", short: "Održan",   plural: "Održani pozivi" },
    { key: 7, icon: "💰", short: "Prodaja",  plural: "Prodaje" },
  ];
  const STAGE_LABEL = { 0:"Nov", 1:"Poslata poruka", 2:"Odgovorio", 3:"Prihvatio da vidi sajt",
    4:"Pozitivan utisak", 5:"Zakazan poziv", 6:"Održan poziv", 7:"Prodaja" };
  // boja po fazi (hue skala plava -> zelena)
  const STAGE_COLOR = { 1:"#6b7280", 2:"#2563eb", 3:"#0891b2", 4:"#7c3aed", 5:"#d97706", 6:"#0d9488", 7:"#059669" };

  const TYPE_ICONS = { poziv: "📞", poruka: "💬", email: "✉️", sastanak: "🤝", beleska: "📝" };
  const TYPE_LABELS = { poziv: "Poziv", poruka: "Poruka", email: "Email", sastanak: "Sastanak", beleska: "Beleška" };
  const AVATAR_COLORS = ["#3b6ef5","#7c3aed","#059669","#d97706","#dc2626","#0891b2","#db2777","#65a30d"];

  let state = load();
  migrateAll();

  // ---------- Persistence ----------
  function load() {
    try { const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); } catch (e) {}
    return { contacts: [] };
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); }
    catch (e) { alert("Greška pri čuvanju (možda je memorija browsera puna)."); }
  }
  function migrateAll() {
    if (!state || !Array.isArray(state.contacts)) state = { contacts: [] };
    for (const c of state.contacts) {
      if (typeof c.stage !== "number") {
        const map = { nov: 0, kontaktiran: 1, zainteresovan: 2, dogovoreno: 5, odbijen: 1 };
        c.stage = (c.status != null && map[c.status] != null) ? map[c.status] : 0;
        if (c.status === "odbijen") c.dead = true;
        delete c.status;
      }
      if (typeof c.dead !== "boolean") c.dead = false;
      if (!c.id) c.id = uid();
      if (!c.activities) c.activities = [];
      if (!c.createdAt) c.createdAt = Date.now();
    }
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

  // ---------- Helpers ----------
  const $ = (id) => document.getElementById(id);
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c])); }
  function initials(name) {
    const p = (name || "?").trim().split(/\s+/);
    return ((p[0]||"")[0] || "?").toUpperCase() + ((p[1]||"")[0] || "").toUpperCase();
  }
  function colorFor(id) { let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) % AVATAR_COLORS.length; return AVATAR_COLORS[h]; }
  function todayStr() { return new Date().toISOString().slice(0, 10); }
  function fmtDate(iso) { if (!iso) return ""; const d = new Date(iso); if (isNaN(d)) return iso;
    return d.toLocaleDateString("sr-RS", { day: "2-digit", month: "2-digit", year: "numeric" }); }
  function fmtDateTime(iso) { if (!iso) return ""; const d = new Date(iso); if (isNaN(d)) return iso;
    return d.toLocaleDateString("sr-RS", { day: "2-digit", month: "2-digit", year: "numeric" }) +
      " " + d.toLocaleTimeString("sr-RS", { hour: "2-digit", minute: "2-digit" }); }
  function lastActivityTime(c) { if (!c.activities || !c.activities.length) return c.createdAt || 0;
    return c.activities.reduce((m, a) => Math.max(m, new Date(a.date).getTime() || 0), 0); }
  function followupState(c) { if (!c.followup) return null; const t = todayStr();
    if (c.followup < t) return "due"; if (c.followup === t) return "today"; return "upcoming"; }

  // ---------- Funnel dashboard ----------
  function renderFunnel() {
    // Broj kontakata koji su dostigli bar fazu key (redosledno => stage >= key)
    const counts = STAGES.map(s => state.contacts.filter(c => (c.stage || 0) >= s.key).length);
    const base = Math.max(counts[0], 1);
    const html = STAGES.map((s, i) => {
      const n = counts[i];
      const pct = Math.round((n / base) * 100);
      let conv = "";
      if (i > 0) {
        const prev = counts[i - 1];
        conv = prev > 0 ? Math.round((n / prev) * 100) + "%" : "—";
      } else {
        conv = "start";
      }
      return `<div class="f-row" style="--pct:${pct}%">
        <div class="f-bar" style="background:${STAGE_COLOR[s.key]}"></div>
        <div class="f-content">
          <span class="f-ico">${s.icon}</span>
          <span class="f-label">${esc(s.plural)}</span>
          <span class="f-conv" title="konverzija sa prethodnog koraka">${conv}</span>
          <span class="f-num">${n}</span>
        </div>
      </div>`;
    }).join("");
    $("funnel").innerHTML = html;

    // mini stats
    let due = 0, dead = 0;
    for (const c of state.contacts) {
      const fs = followupState(c); if (fs === "due" || fs === "today") due++;
      if (c.dead) dead++;
    }
    const active = state.contacts.length - dead;
    $("miniStats").innerHTML = [
      `<div class="mini"><div class="n">${state.contacts.length}</div><div class="l">Ukupno kontakata</div></div>`,
      `<div class="mini"><div class="n">${active}</div><div class="l">Aktivni</div></div>`,
      `<div class="mini${due>0?" alert":""}"><div class="n">${due}</div><div class="l">Follow-up danas/dospeli</div></div>`,
      `<div class="mini"><div class="n">${dead}</div><div class="l">Odbijeni</div></div>`,
    ].join("");
  }

  // ---------- Contacts list ----------
  function renderContacts() {
    const wrap = $("contacts");
    const q = $("search").value.trim().toLowerCase();
    const fStage = $("filterStage").value;
    const sortBy = $("sortBy").value;
    const onlyDue = $("onlyDue").checked;

    let list = state.contacts.slice();
    if (q) list = list.filter(c => [c.name, c.company, c.phone, c.email, c.source, c.notes].join(" ").toLowerCase().includes(q));
    if (fStage === "dead") list = list.filter(c => c.dead);
    else if (fStage) { const need = parseInt(fStage.slice(1), 10); list = list.filter(c => (c.stage || 0) >= need); }
    if (onlyDue) list = list.filter(c => { const s = followupState(c); return s === "due" || s === "today"; });

    list.sort((a, b) => {
      if (sortBy === "name") return (a.name || "").localeCompare(b.name || "", "sr");
      if (sortBy === "created") return (b.createdAt || 0) - (a.createdAt || 0);
      if (sortBy === "recent") return lastActivityTime(b) - lastActivityTime(a);
      if (sortBy === "stage") return (b.stage || 0) - (a.stage || 0) || (a.name||"").localeCompare(b.name||"","sr");
      const af = a.followup || "9999-99-99", bf = b.followup || "9999-99-99";
      return af.localeCompare(bf);
    });

    if (!state.contacts.length) {
      wrap.innerHTML = `<div class="empty"><div class="big">📇</div><div>Još nema kontakata.</div>
        <div style="margin-top:10px;"><button class="btn primary" onclick="document.getElementById('addContactBtn').click()">+ Dodaj prvi kontakt</button></div></div>`;
      return;
    }
    if (!list.length) { wrap.innerHTML = `<div class="empty"><div class="big">🔍</div><div>Nema rezultata za zadate filtere.</div></div>`; return; }

    const openIds = new Set([...wrap.querySelectorAll(".card.open")].map(c => c.dataset.id));
    wrap.innerHTML = list.map(c => renderContactCard(c, openIds.has(c.id))).join("");
  }

  function stageBadge(c) {
    if (c.dead) return `<span class="badge dead">Odbijen</span>`;
    const st = c.stage || 0;
    if (st === 0) return `<span class="badge stage0">Nov</span>`;
    return `<span class="badge" style="background:${STAGE_COLOR[st]}">${esc(STAGE_LABEL[st])}</span>`;
  }

  function stageTrack(c) {
    const st = c.stage || 0;
    return `<div class="stage-track">` + STAGES.map(s =>
      `<button class="stage-chip${st >= s.key ? " reached" : ""}" data-stage="${s.key}" data-cid="${c.id}" title="${esc(STAGE_LABEL[s.key])}">
        <span class="num">${s.key}</span>${s.icon} ${esc(s.short)}</button>`
    ).join("") + `</div>`;
  }

  function renderContactCard(c, isOpen) {
    const fs = followupState(c);
    let fpHtml = "";
    if (c.followup) {
      const label = fs === "due" ? "Dospeo follow-up: " : fs === "today" ? "Follow-up danas: " : "Follow-up: ";
      fpHtml = `<div class="followup-pill ${fs}">⏰ ${label}${fmtDate(c.followup)}</div>`;
    }
    const acts = (c.activities || []).slice().sort((a, b) => new Date(b.date) - new Date(a.date));
    const lastAct = acts[0];
    const contactLines = [];
    if (c.company) contactLines.push(esc(c.company));
    if (c.phone) contactLines.push(`<a href="tel:${esc(c.phone)}">📞 ${esc(c.phone)}</a>`);
    if (c.email) contactLines.push(`<a href="mailto:${esc(c.email)}">✉️ ${esc(c.email)}</a>`);

    return `<div class="card${isOpen ? " open" : ""}" data-id="${c.id}">
      <div class="contact-head" data-toggle="${c.id}">
        <div class="avatar" style="background:${colorFor(c.id)}">${esc(initials(c.name))}</div>
        <div class="contact-main">
          <div class="contact-name">${esc(c.name || "Bez imena")} ${stageBadge(c)}</div>
          <div class="contact-sub">${contactLines.join(" · ") || "<span style='color:var(--text-faint)'>nema kontakt podataka</span>"}</div>
          ${fpHtml}
        </div>
        <div class="contact-meta">
          ${c.source ? `<div>izvor: ${esc(c.source)}</div>` : ""}
          <div>${acts.length} aktivnosti</div>
          ${lastAct ? `<div>posl.: ${esc(fmtDate(lastAct.date))}</div>` : ""}
        </div>
      </div>
      <div class="contact-body"><div class="contact-body-inner">
        <div style="font-size:12px;font-weight:700;color:var(--text-soft);margin-bottom:7px;">FAZA U LEVKU · klikni da pomeriš</div>
        ${stageTrack(c)}
        <div class="quick-actions">
          <button class="btn sm" data-act="poziv" data-id="${c.id}">📞 Poziv</button>
          <button class="btn sm" data-act="poruka" data-id="${c.id}">💬 Poruka</button>
          <button class="btn sm" data-act="email" data-id="${c.id}">✉️ Email</button>
          <button class="btn sm" data-act="sastanak" data-id="${c.id}">🤝 Sastanak</button>
          <button class="btn sm" data-act="beleska" data-id="${c.id}">📝 Beleška</button>
          <span style="flex:1"></span>
          <button class="btn sm" data-edit="${c.id}">✎ Izmeni</button>
        </div>
        ${c.notes ? `<div style="background:var(--surface-2);padding:10px 12px;border-radius:9px;margin-bottom:14px;font-size:13px;white-space:pre-wrap;">${esc(c.notes)}</div>` : ""}
        <div class="activity-list">
          ${acts.length ? acts.map(a => renderActivity(c.id, a)).join("") :
            `<div style="color:var(--text-faint);font-size:13px;padding:6px 0;">Još nema zabeleženih aktivnosti. Klikni dugme iznad da dodaš poziv ili poruku.</div>`}
        </div>
      </div></div>
    </div>`;
  }

  function renderActivity(cid, a) {
    return `<div class="activity">
      <div class="act-icon">${TYPE_ICONS[a.type] || "📝"}</div>
      <div class="act-body">
        <div class="act-top">
          <span class="act-type">${esc(TYPE_LABELS[a.type] || a.type)}${a.outcome ? ` — <span class="act-outcome">${esc(a.outcome)}</span>` : ""}</span>
          <span class="act-date">${esc(fmtDateTime(a.date))}
            <button class="act-del" title="Obriši" data-delact="${a.id}" data-cid="${cid}">🗑</button></span>
        </div>
        ${a.note ? `<div class="act-note">${esc(a.note)}</div>` : ""}
      </div>
    </div>`;
  }

  // ---------- Stage quick-set ----------
  function setStage(cid, key) {
    const c = state.contacts.find(x => x.id === cid);
    if (!c) return;
    // klik na trenutnu najdalju fazu => vrati za jedan (toggle nazad)
    c.stage = (c.stage === key) ? key - 1 : key;
    if (c.stage < 0) c.stage = 0;
    save(); renderAll();
    const card = document.querySelector(`.card[data-id="${cid}"]`); if (card) card.classList.add("open");
  }

  // ---------- Contact modal ----------
  function openContactModal(c) {
    $("contactModalTitle").textContent = c ? "Izmeni kontakt" : "Novi kontakt";
    $("c_id").value = c ? c.id : "";
    $("c_name").value = c ? c.name || "" : "";
    $("c_company").value = c ? c.company || "" : "";
    $("c_phone").value = c ? c.phone || "" : "";
    $("c_email").value = c ? c.email || "" : "";
    $("c_stage").value = c ? String(c.stage || 0) : "0";
    $("c_source").value = c ? c.source || "" : "";
    $("c_followup").value = c ? c.followup || "" : "";
    $("c_dead").checked = c ? !!c.dead : false;
    $("c_notes").value = c ? c.notes || "" : "";
    $("deleteContactBtn").style.display = c ? "inline-flex" : "none";
    $("contactOverlay").classList.add("show");
    $("c_name").focus();
  }
  function closeContactModal() { $("contactOverlay").classList.remove("show"); }

  function saveContact() {
    const name = $("c_name").value.trim();
    if (!name) { alert("Unesi bar ime kontakta."); $("c_name").focus(); return; }
    const id = $("c_id").value;
    const data = {
      name,
      company: $("c_company").value.trim(),
      phone: $("c_phone").value.trim(),
      email: $("c_email").value.trim(),
      stage: parseInt($("c_stage").value, 10) || 0,
      source: $("c_source").value.trim(),
      followup: $("c_followup").value,
      dead: $("c_dead").checked,
      notes: $("c_notes").value.trim(),
    };
    if (id) { const c = state.contacts.find(x => x.id === id); if (c) Object.assign(c, data); }
    else { state.contacts.push(Object.assign({ id: uid(), createdAt: Date.now(), activities: [] }, data)); }
    save(); closeContactModal(); renderAll();
  }

  function deleteContact() {
    const id = $("c_id").value;
    const c = state.contacts.find(x => x.id === id);
    if (!c) return;
    if (!confirm(`Obrisati kontakt "${c.name}" i sve njegove aktivnosti?`)) return;
    state.contacts = state.contacts.filter(x => x.id !== id);
    save(); closeContactModal(); renderAll();
  }

  // ---------- Activity modal ----------
  function openActivityModal(cid, presetType) {
    $("a_contactId").value = cid;
    $("a_type").value = presetType || "poziv";
    const now = new Date(); now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
    $("a_date").value = now.toISOString().slice(0, 16);
    $("a_outcome").value = "";
    $("a_note").value = "";
    $("a_nextFollowup").value = "";
    $("activityOverlay").classList.add("show");
    $("a_note").focus();
  }
  function closeActivityModal() { $("activityOverlay").classList.remove("show"); }

  function saveActivity() {
    const cid = $("a_contactId").value;
    const c = state.contacts.find(x => x.id === cid);
    if (!c) return;
    if (!c.activities) c.activities = [];
    const dateVal = $("a_date").value;
    const type = $("a_type").value;
    const outcome = $("a_outcome").value;
    c.activities.push({ id: uid(), type, date: dateVal ? new Date(dateVal).toISOString() : new Date().toISOString(),
      outcome, note: $("a_note").value.trim() });

    // Lagano automatsko pomeranje faze na osnovu tipa/ishoda (nikad unazad)
    let target = 0;
    if (type === "poruka" || type === "email") target = 1;
    if (outcome === "Poslato") target = Math.max(target, 1);
    if (outcome === "Odgovorio") target = Math.max(target, 2);
    if (outcome === "Zainteresovan") target = Math.max(target, 4);
    if (outcome === "Zakazano") target = Math.max(target, 5);
    if (type === "sastanak" || outcome === "Održan poziv") target = Math.max(target, 6);
    if (outcome === "Prodaja") target = Math.max(target, 7);
    if (target > (c.stage || 0)) c.stage = target;
    if (outcome === "Odbio") c.dead = true;

    const nf = $("a_nextFollowup").value;
    if (nf) c.followup = nf;
    save(); closeActivityModal(); renderAll();
    const card = document.querySelector(`.card[data-id="${cid}"]`); if (card) card.classList.add("open");
  }

  function deleteActivity(cid, aid) {
    const c = state.contacts.find(x => x.id === cid);
    if (!c) return;
    if (!confirm("Obrisati ovu aktivnost?")) return;
    c.activities = (c.activities || []).filter(a => a.id !== aid);
    save(); renderAll();
    const card = document.querySelector(`.card[data-id="${cid}"]`); if (card) card.classList.add("open");
  }

  // ---------- Export / Import ----------
  function exportJSON() { saveFile(`outreach-crm-backup-${todayStr()}.json`, JSON.stringify(state, null, 2), "application/json"); }
  function exportCSV() {
    const rows = [["Ime","Firma","Telefon","Email","Faza","Naziv faze","Odbijen","Izvor","Follow-up","Broj aktivnosti","Poslednja aktivnost","Napomena"]];
    for (const c of state.contacts) {
      const acts = (c.activities || []).slice().sort((a,b)=>new Date(b.date)-new Date(a.date));
      rows.push([ c.name||"", c.company||"", c.phone||"", c.email||"", c.stage||0, STAGE_LABEL[c.stage||0]||"",
        c.dead?"da":"ne", c.source||"", c.followup||"", (c.activities||[]).length,
        acts[0]?fmtDateTime(acts[0].date):"", (c.notes||"").replace(/\n/g," ") ]);
    }
    const csv = rows.map(r => r.map(cell => { const s = String(cell); return /[",\n;]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(";")).join("\r\n");
    saveFile(`outreach-crm-${todayStr()}.csv`, "﻿" + csv, "text/csv;charset=utf-8");
  }
  async function saveFile(name, text, mime) {
    try {
      const dl = window.claude && typeof window.claude.use === "function" ? await window.claude.use("downloads") : null;
      if (dl) { try { await dl.save({ filename: name, data: text }); return; } catch (e) { if (e && e.code === "declined") return; } }
    } catch (e) {}
    const blob = new Blob([text], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }
  function importJSON(file) {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const data = JSON.parse(reader.result);
        if (!data || !Array.isArray(data.contacts)) throw new Error("format");
        if (!confirm(`Uvezi ${data.contacts.length} kontakata? Ovo će zameniti trenutne podatke.`)) return;
        state = data; migrateAll(); save(); renderAll(); alert("Podaci uvezeni.");
      } catch (e) { alert("Neispravan fajl. Očekivan je backup JSON iz ove aplikacije."); }
    };
    reader.readAsText(file);
  }

  // ---------- Theme ----------
  function applyTheme(t) { if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme"); }
  function toggleTheme() {
    const cur = localStorage.getItem(THEME_KEY);
    const isDark = document.documentElement.getAttribute("data-theme") === "dark" || (!cur && window.matchMedia("(prefers-color-scheme: dark)").matches);
    const next = isDark ? "light" : "dark";
    try { localStorage.setItem(THEME_KEY, next); } catch(e) {}
    applyTheme(next);
  }

  // ---------- Render all ----------
  function renderAll() { renderFunnel(); renderContacts(); }

  // ---------- Events ----------
  $("addContactBtn").addEventListener("click", () => openContactModal(null));
  $("saveContactBtn").addEventListener("click", saveContact);
  $("deleteContactBtn").addEventListener("click", deleteContact);
  $("saveActivityBtn").addEventListener("click", saveActivity);
  $("search").addEventListener("input", renderContacts);
  $("filterStage").addEventListener("change", renderContacts);
  $("sortBy").addEventListener("change", renderContacts);
  $("onlyDue").addEventListener("change", renderContacts);
  $("exportBtn").addEventListener("click", exportJSON);
  $("csvBtn").addEventListener("click", exportCSV);
  $("importBtn").addEventListener("click", () => $("importFile").click());
  $("importFile").addEventListener("change", (e) => { if (e.target.files[0]) importJSON(e.target.files[0]); e.target.value = ""; });
  $("themeBtn").addEventListener("click", toggleTheme);

  document.querySelectorAll("[data-close]").forEach(b => b.addEventListener("click", closeContactModal));
  document.querySelectorAll("[data-close-act]").forEach(b => b.addEventListener("click", closeActivityModal));
  $("contactOverlay").addEventListener("click", (e) => { if (e.target === $("contactOverlay")) closeContactModal(); });
  $("activityOverlay").addEventListener("click", (e) => { if (e.target === $("activityOverlay")) closeActivityModal(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { closeContactModal(); closeActivityModal(); } });

  $("contacts").addEventListener("click", (e) => {
    const stageBtn = e.target.closest("[data-stage]");
    const toggle = e.target.closest("[data-toggle]");
    const editBtn = e.target.closest("[data-edit]");
    const actBtn = e.target.closest("[data-act]");
    const delAct = e.target.closest("[data-delact]");
    if (stageBtn) { e.stopPropagation(); setStage(stageBtn.dataset.cid, parseInt(stageBtn.dataset.stage, 10)); return; }
    if (delAct) { e.stopPropagation(); deleteActivity(delAct.dataset.cid, delAct.dataset.delact); return; }
    if (editBtn) { e.stopPropagation(); openContactModal(state.contacts.find(x => x.id === editBtn.dataset.edit)); return; }
    if (actBtn) { e.stopPropagation(); openActivityModal(actBtn.dataset.id, actBtn.dataset.act); return; }
    if (toggle) { toggle.closest(".card").classList.toggle("open"); return; }
  });

  // ---------- Init ----------
  applyTheme(localStorage.getItem(THEME_KEY));
  renderAll();

  function maybeQuickAdd() {
    const h = (location.hash || "").toLowerCase(), s = (location.search || "").toLowerCase();
    if (h.indexOf("add") !== -1 || s.indexOf("add") !== -1) openContactModal(null);
  }
  maybeQuickAdd();
  window.addEventListener("hashchange", maybeQuickAdd);
})();
</script>
</body>
</html>
